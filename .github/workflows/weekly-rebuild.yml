name: Weekly rebuild

on:
  schedule:
    - cron: '0 6 * * 1'   # her pazartesi 06:00 UTC (09:00 TR)
  workflow_dispatch:        # Actions sekmesinden elle tetikleme butonu

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Cloudflare build
        run: curl -fsS -X POST "$DEPLOY_HOOK"
        env:
          DEPLOY_HOOK: ${{ secrets.CF_DEPLOY_HOOK }}
